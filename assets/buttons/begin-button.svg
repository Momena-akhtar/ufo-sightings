<svg width="220" height="70" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer border (black) -->
  <rect x="4" y="0" width="212" height="4" fill="#000000"/>
  <rect x="0" y="4" width="4" height="62" fill="#000000"/>
  <rect x="216" y="4" width="4" height="62" fill="#000000"/>
  <rect x="4" y="66" width="212" height="4" fill="#000000"/>

  <!-- Main button fill (purple) -->
  <rect x="4" y="4" width="212" height="62" rx="15" ry="15" fill="#9945FF"/>

  <!-- Highlight/shine effect (top-left lighter purple) -->
  <rect x="8" y="8" width="60" height="4" fill="#C084FC"/>
  <rect x="8" y="12" width="40" height="4" fill="#C084FC"/>
  <rect x="8" y="16" width="20" height="4" fill="#C084FC"/>

  <!-- Inner border (darker purple) -->
  <rect x="8" y="58" width="204" height="4" fill="#7C3AED"/>
  <rect x="208" y="8" width="4" height="50" fill="#7C3AED"/>

  <!-- Text "BEGIN" in pixel style -->
  <g fill="#FFFFFF">
    <!-- B -->
    <rect x="50" y="25" width="4" height="20" fill="#FFFFFF"/>
    <rect x="54" y="25" width="8" height="4" fill="#FFFFFF"/>
    <rect x="54" y="33" width="8" height="4" fill="#FFFFFF"/>
    <rect x="54" y="41" width="8" height="4" fill="#FFFFFF"/>
    <rect x="62" y="29" width="4" height="4" fill="#FFFFFF"/>
    <rect x="62" y="37" width="4" height="4" fill="#FFFFFF"/>

    <!-- E -->
    <rect x="72" y="25" width="4" height="20" fill="#FFFFFF"/>
    <rect x="76" y="25" width="8" height="4" fill="#FFFFFF"/>
    <rect x="76" y="33" width="8" height="4" fill="#FFFFFF"/>
    <rect x="76" y="41" width="8" height="4" fill="#FFFFFF"/>

    <!-- G -->
    <rect x="90" y="25" width="4" height="20" fill="#FFFFFF"/>
    <rect x="94" y="25" width="8" height="4" fill="#FFFFFF"/>
    <rect x="94" y="41" width="8" height="4" fill="#FFFFFF"/>
    <rect x="102" y="29" width="4" height="4" fill="#FFFFFF"/>
    <rect x="98" y="33" width="8" height="8" fill="#FFFFFF"/>

    <!-- I -->
    <rect x="112" y="25" width="8" height="4" fill="#FFFFFF"/>
    <rect x="116" y="29" width="4" height="12" fill="#FFFFFF"/>
    <rect x="112" y="41" width="8" height="4" fill="#FFFFFF"/>

    <!-- N -->
    <rect x="126" y="25" width="4" height="20" fill="#FFFFFF"/>
    <rect x="130" y="29" width="4" height="4" fill="#FFFFFF"/>
    <rect x="134" y="33" width="4" height="4" fill="#FFFFFF"/>
    <rect x="138" y="37" width="4" height="4" fill="#FFFFFF"/>
    <rect x="142" y="25" width="4" height="20" fill="#FFFFFF"/>
  </g>
</svg>